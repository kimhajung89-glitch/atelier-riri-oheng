<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4ee">
<title>아뜰리에리리 · 오행 개운컬러 찾기</title>
<style>
:root{--ink:#3f3a34;--muted:#837a70;--line:#e7e0d6;--paper:#fffdfa;--bg:#f7f4ee}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif}
main{max-width:560px;margin:auto;padding:24px 16px 54px}.brand{text-align:center;font-size:11px;letter-spacing:.22em;color:#8f857a}
h1{text-align:center;font-size:27px;margin:10px 0 8px}.lead{text-align:center;color:var(--muted);font-size:14px;line-height:1.75;margin:0 0 22px}
.card{background:var(--paper);border:1px solid #eee8df;border-radius:24px;padding:20px;box-shadow:0 10px 28px #3f3a3408;margin:14px 0}
label{display:block;font-size:13px;font-weight:800;margin:13px 0 7px}input,select{width:100%;height:48px;border:1px solid #ddd5ca;border-radius:13px;background:#fff;padding:0 13px;font-size:16px;color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{display:block;width:100%;border:0;border-radius:14px;background:#403a34;color:#fff;font-size:16px;font-weight:800;padding:15px;margin-top:18px;cursor:pointer}.btn.light{background:#fff;color:var(--ink);border:1px solid #d9d0c5}.error{display:none;background:#fff0ed;color:#a84d40;border-radius:12px;padding:12px;margin-top:12px;font-size:13px;line-height:1.5}
.result{display:none}.tag{font-size:12px;color:#978d82;font-weight:800}.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.pillar{text-align:center;background:#f8f5ef;border-radius:14px;padding:11px 4px}.pillar small{display:block;color:#948a80;font-size:11px;margin-bottom:5px}.pillar b{font-size:19px}
.barrow{margin:13px 0}.barhead{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.bar{height:9px;background:#eee9e1;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;border-radius:20px}
.hero{text-align:center;border-radius:22px;padding:26px 18px;margin:16px 0}.hero .emoji{font-size:42px}.hero .color{font-size:30px;font-weight:900;margin:4px 0}.hero .element{font-size:13px;color:#71685f}
.stone{font-size:22px;font-weight:900;margin:5px 0}.desc{font-size:14px;line-height:1.75;color:#665e56}.footer-note{font-size:11px;color:#978e84;line-height:1.65;margin-top:14px}
.cta{background:#f2eee7;border-radius:18px;padding:17px;margin-top:15px}.cta b{display:block;margin-bottom:6px}.small{font-size:12px;color:#756d65;line-height:1.6}
</style>
</head>
<body>
<main>
  <div class="brand">ATELIER RIRI</div>
  <h1>🔮 오행 개운컬러 찾기</h1>
  <p class="lead">생년월일과 태어난 시간을 입력하면<br>나의 오행과 개운 컬러, 2mm 천연석을 확인해보세요.</p>

  <section class="card">
    <label>생년월일</label>
    <input id="birth" type="date">
    <div class="grid">
      <div><label>달력</label><select id="calendar"><option value="solar">양력</option><option value="lunar">음력</option></select></div>
      <div><label>성별</label><select id="gender"><option value="female">여성</option><option value="male">남성</option></select></div>
    </div>
    <div class="grid">
      <div><label>태어난 시</label><select id="hour"></select></div>
      <div><label>태어난 분</label><select id="minute"></select></div>
    </div>
    <label>출생지역</label>
    <select id="region">
      <option value="127.5">대한민국(기본)</option><option value="126.978">서울</option><option value="129.075">부산</option>
      <option value="126.705">인천</option><option value="128.601">대구</option><option value="127.384">대전</option>
      <option value="126.852">광주</option><option value="129.311">울산</option>
    </select>
    <button class="btn" onclick="run()">✨ 내 개운컬러 확인하기</button>
    <div id="error" class="error"></div>
    <div class="footer-note">※ 본 서비스는 전통 명리학의 오행 해석을 바탕으로 한 참고용 콘텐츠입니다. 미래나 건강·재물 등의 결과를 보장하지 않습니다.</div>
  </section>

  <section id="result" class="result">
    <div class="card">
      <div class="tag">나의 사주팔자</div>
      <div class="pillars" id="pillars"></div>
      <div style="margin-top:16px"><div class="tag">일간(日干)</div><div id="daymaster" style="font-size:21px;font-weight:900;margin-top:3px"></div></div>
    </div>
    <div class="card">
      <div class="tag">오행 분포</div><div id="bars"></div>
    </div>
    <div class="card">
      <div class="tag">나의 개운컬러</div>
      <div id="hero" class="hero">
        <div class="emoji" id="emoji"></div><div class="color" id="color"></div><div class="element" id="element"></div>
      </div>
      <div class="tag">추천 천연석 · 2mm</div>
      <div class="stone" id="stone"></div>
      <div class="desc" id="desc"></div>
      <div class="cta"><b>🧵 나만의 오행 매듭팔찌</b><div class="small" id="bracelet"></div></div>
      <button class="btn" onclick="shareResult()">📤 결과 공유하기</button>
      <button class="btn light" onclick="copyResult()">결과 문구 복사하기</button>
      <button class="btn light" onclick="window.scrollTo({top:0,behavior:'smooth'})">다시 조회하기</button>
    </div>
  </section>
</main>

<script>
const stems="갑을병정무기경신임계", branches="자축인묘진사오미신유술해";
const stemEl={갑:"목",을:"목",병:"화",정:"화",무:"토",기:"토",경:"금",신:"금",임:"수",계:"수"};
const branchEl={자:"수",축:"토",인:"목",묘:"목",진:"토",사:"화",오:"화",미:"토",신:"금",유:"금",술:"토",해:"수"};
const data={
목:{emoji:"🌿",color:"초록",stone:"그린가넷",bg:"#edf5e9",desc:"성장과 새로운 시작을 상징하는 그린 계열의 컬러와 원석입니다."},
화:{emoji:"🔥",color:"레드·코랄",stone:"가넷",bg:"#fff0ec",desc:"활력과 따뜻한 표현을 상징하는 레드·코랄 계열의 컬러와 원석입니다."},
토:{emoji:"🌏",color:"옐로우·브라운",stone:"호안석",bg:"#f7efe2",desc:"안정과 균형을 상징하는 옐로우·브라운 계열의 컬러와 원석입니다."},
금:{emoji:"🤍",color:"화이트",stone:"문스톤",bg:"#f3f3f0",desc:"맑고 은은한 분위기를 표현하는 화이트 계열의 컬러와 원석입니다."},
수:{emoji:"🩵",color:"하늘색·블루",stone:"블루 아파타이트",bg:"#e9f6fa",desc:"맑은 흐름과 유연한 분위기를 표현하는 하늘색·블루 계열의 컬러와 원석입니다."}
};
const kor={목:"木",화:"火",토:"土",금:"金",수:"水"};
const order=["목","화","토","금","수"];
for(let h=0;h<24;h++)hour.innerHTML+=`<option value="${h}">${String(h).padStart(2,"0")}시</option>`;
for(let m=0;m<60;m++)minute.innerHTML+=`<option value="${m}">${String(m).padStart(2,"0")}분</option>`;
hour.value=12;

function mod(n,m){return ((n%m)+m)%m}
function dayPillar(y,m,d){
  // Gregorian JDN -> sexagenary day; index 0 = 甲子. This convention is anchored to 2000-01-07 = 甲子.
  const a=Math.floor((14-m)/12), yy=y+4800-a, mm=m+12*a-3;
  const jdn=d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;
  const idx=mod(jdn-2451551,60);
  return {stem:stems[idx%10],branch:branches[idx%12],idx};
}
function yearPillar(y,m,d){
  const yy=(m<2 || (m===2&&d<4))?y-1:y;
  const idx=mod(yy-4,60);return {stem:stems[idx%10],branch:branches[idx%12],idx};
}
function monthPillar(y,m,d){
  // Approximate solar-term month boundaries for the consumer prototype.
  const day = d + (m===2? -3 : 0);
  let branchIndex;
  if(m===2) branchIndex=1; else branchIndex=mod(m+1,12);
  if(day<6 && m!==2) branchIndex=mod(branchIndex-1,12);
  const yp=yearPillar(y,m,d), ystemIndex=stems.indexOf(yp.stem);
  const tigerStem=[ "갑","기","을","경","병","신","정","임","무","계" ][ystemIndex%10];
  const stemIndex=mod(stems.indexOf(tigerStem)+mod(branchIndex-2,10),10);
  return {stem:stems[stemIndex],branch:branches[branchIndex]};
}
function hourPillar(dayStem,h){
  // 子 hour begins 23:00; two-hour branches.
  const bi=mod(Math.floor((h+1)/2),12);
  const dsi=stems.indexOf(dayStem);
  const ziStem=["갑","기","을","경","병","신","정","임","무","계"][dsi%10];
  const si=mod(stems.indexOf(ziStem)+bi,10);
  return {stem:stems[si],branch:branches[bi]};
}
function lunarNotice(){return calendar.value==="lunar"?"현재 브라우저 단독 버전은 음력 날짜를 입력해도 양력 환산을 자동 수행하지 않습니다. 판매용 공개 버전에서는 KASI 음양력 변환 데이터를 연결해야 정확한 음력/윤달 계산이 가능합니다.":""}
function run(){
  const err=document.getElementById("error");err.style.display="none";
  const v=birth.value;if(!v){err.textContent="생년월일을 입력해주세요.";err.style.display="block";return}
  if(calendar.value==="lunar"){err.textContent="현재 최종 파일은 양력 입력을 기준으로 먼저 완성했습니다. 음력·윤달까지 정확히 지원하려면 음양력 변환 데이터 연결 단계가 필요합니다.";err.style.display="block";return}
  const [y,m,d]=v.split("-").map(Number),h=+hour.value;
  const yp=yearPillar(y,m,d),mp=monthPillar(y,m,d),dp=dayPillar(y,m,d),hp=hourPillar(dp.stem,h);
  const ps=[["년주",yp],["월주",mp],["일주",dp],["시주",hp]];
  pillars.innerHTML=ps.map(p=>`<div class="pillar"><small>${p[0]}</small><b>${p[1].stem}${p[1].branch}</b></div>`).join("");
  daymaster.textContent=`${dp.stem} · ${stemEl[dp.stem]}(${kor[stemEl[dp.stem]]})`;
  const c={목:0,화:0,토:0,금:0,수:0};
  ps.forEach(p=>{c[stemEl[p[1].stem]]++;c[branchEl[p[1].branch]]++});
  bars.innerHTML=order.map(k=>{const n=c[k],pct=Math.round(n/8*100);return `<div class="barrow"><div class="barhead"><span>${k} · ${kor[k]}</span><b>${n}</b></div><div class="bar"><i style="width:${pct}%"></i></div></div>`}).join("");
  // Prototype sales rule: select the least represented element. Tie-breaker follows the order below.
  const min=Math.min(...order.map(k=>c[k]));const target=order.find(k=>c[k]===min);const x=data[target];
  emoji.textContent=x.emoji;color.textContent=x.color;element.textContent=`보완 오행 · ${target}(${kor[target]})`;
  stone.textContent=x.stone;desc.textContent=x.desc;bracelet.textContent=`${x.color} 계열 매듭 + ${x.stone} 2mm 천연석으로 제작하는 ${target} 오행 매듭팔찌입니다.`;
  hero.style.background=x.bg;result.style.display="block";result.scrollIntoView({behavior:"smooth"});
}
function resultText(){return `아뜰리에리리 오행 개운컬러 찾기\n개운컬러: ${color.textContent}\n보완 오행: ${element.textContent}\n추천 원석: ${stone.textContent} 2mm\n#오행개운컬러 #오행팔찌 #아뜰리에리리`}
async function shareResult(){
  const t=resultText();
  if(navigator.share){try{await navigator.share({title:"나의 오행 개운컬러",text:t})}catch(e){}}
  else copyResult();
}
async function copyResult(){try{await navigator.clipboard.writeText(resultText());alert("결과 문구를 복사했습니다.")}catch(e){prompt("아래 문구를 복사해주세요.",resultText())}}
</script>
</body>
</html>
